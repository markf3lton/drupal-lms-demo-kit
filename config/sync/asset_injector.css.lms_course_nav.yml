id: lms_course_nav
label: 'Olivero - Course nav tweaks'
code: |-
  /* Course nav on the left at desktop widths; smaller widths keep Olivero's default stacking. */
  @media (min-width: 62.5rem) {
    .sidebar-grid > .region--sidebar {
      grid-row: 1;
      grid-column: 1 / 5;
    }
    .sidebar-grid > .site-main {
      grid-row: 1;
      grid-column: 6 / 15;
    }
  }

  /* Size the course name for a sidebar. */
  .lms-course-navigation-container .lms-course-navigation-title {
    font-size: 1.25rem;
  }

  /* Page titles 8px smaller than Olivero's default at tablet widths and up. */
  @media (min-width: 43.75rem) {
    .page-title {
      font-size: 3.25rem;
      line-height: 1.15;
    }
  }

  /* Make the fill-in-the-blank activity not break lines funny. */
  .question-text p { display: inline; }
  .question-text .drop-zone { display: inline-block; vertical-align: baseline; }

  /* Compact activity titles, top-aligned with the course nav. */
  @media (min-width: 43.75rem) {
    .path-course .page-title {
      margin-top: 0;
      font-size: 2rem;
      line-height: 1.25;
    }
  }

  /* Breadcrumb lines up with the content column beside the course nav. */
  @media (min-width: 62.5rem) {
    .path-course .region--breadcrumb > * {
      grid-column: 6 / 15;
    }
  }

  /* Catalog: less space between the page title and the course grid. */
  .path-frontpage .region--content-above .page-title,
  .path-courses .region--content-above .page-title {
    margin-block-end: 0;
    line-height: 1.1;
  }

  /* Catalog: less space between the header and the page title. */
  .path-frontpage .main-content__container,
  .path-courses .main-content__container {
    padding-block-start: var(--sp2);
  }
  .path-frontpage .region--content-above .page-title,
  .path-courses .region--content-above .page-title {
    margin-block-start: 0;
  }
media: all
preprocess: true
conditions:
  current_theme:
    id: current_theme
    negate: false
    theme: olivero
